<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAS导航首页</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-color: #FFFFFF;
            --text-secondary: #AAAAAA;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #F5F6F8;
                --card-bg: #FFFFFF;
                --card-border: #E0E2E7;
                --text-color: #1A1A1A;
                --text-secondary: #666666;
            }
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1.6;
            padding: 20px;
            box-sizing: border-box;
        }
        p {
            margin: 8px 0;
            text-align: left;
        }
        div.container {
            width: 85%;
            max-width: 680px;
            padding: 28px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            overflow-y: auto;
            max-height: 85vh;
        }
        .title {
            text-align: center;
            font-size: 1.6em;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }
        .desc {
            color: var(--text-secondary);
            font-size: 0.95em;
            margin-bottom: 20px;
        }
        .section-title {
            font-weight: 600;
            margin-top: 16px;
        }
        .tips {
            margin-top: 20px;
            font-size: 0.85em;
            color: var(--text-secondary);
            border-top: 1px solid var(--card-border);
            padding-top: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <p class="title">NAS导航</p>
    <p class="desc">极简、纯粹的 Web 封装容器。支持指定 IPv4/IPv6 解析、全屏模式与 AMOLED 暗色沉浸体验。</p>
    
    <p class="section-title">使用说明：</p>
    <p>1. 下拉并点击左侧设置按钮，填写主页地址，点保存即可</p>
    <p>2. 下拉默认为刷新及功能按钮（可设置横屏禁止刷新）</p>
    <p>3. 侧滑返回上一页</p>
    <p>4. 支持设置 IP 偏好（IPv4 / IPv6 解析）与主题模式</p>
    
    <p class="tips">提示：应用的访问速度取决于目标站点本身的响应质量及当前网络环境。</p>
</div>
</body>
</html>
